name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: cvfit_db
          MYSQL_USER: test_user        # Створюємо окремого користувача
          MYSQL_PASSWORD: test_password # Пароль для нього
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          
          # Очищення від Windows-пакетів + динамічна підміна конфігу бази даних
          python -c "
          import os
          
          encoding = 'utf-8'
          if os.path.exists('requirements.txt'):
              with open('requirements.txt', 'rb') as f:
                  raw = f.read(2)
                  if raw == b'\xff\xfe' or raw == b'\xfe\xff':
                      encoding = 'utf-16'
          
          with open('requirements.txt', 'r', encoding=encoding) as f:
              lines = f.readlines()
          
          keywords = ['win32', 'pypiwin32', 'pyttsx3', 'pyaudio']
          clean_lines = []
          for line in lines:
              if any(kw in line.lower() for kw in keywords):
                  continue
              if 'grpcio-status' in line.lower():
                  clean_lines.append('grpcio-status>=1.62.0,<1.63.0\n')
                  continue
              if 'protobuf' in line.lower():
                  clean_lines.append('protobuf==4.25.3\n')
                  continue
              clean_lines.append(line)
              
          if not any('protobuf' in l.lower() for l in clean_lines):
              clean_lines.append('protobuf==4.25.3\n')
          
          with open('requirements.txt', 'w', encoding='utf-8') as f:
              f.writelines(clean_lines)
              
          # МОДИФІКАЦІЯ SQL КОНФІГУ ДЛЯ ТЕСТІВ
          # Якщо у вашому файлі mySQL_connect.py є словник 'config', ми змусимо його читати змінні оточення
          if os.path.exists('mySQL_connect.py'):
              with open('mySQL_connect.py', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Впроваджуємо динамічний фікс на початок файлу
              fix_code = (
                  'import os\n'
                  '# Перевизначаємо конфіг для середовища GitHub Actions\n'
                  'config = {\n'
                  '    \"host\": os.getenv(\"DB_HOST\", \"127.0.0.1\"),\n'
                  '    \"user\": os.getenv(\"DB_USER\", \"test_user\"),\n'
                  '    \"password\": os.getenv(\"DB_PASSWORD\", \"test_password\"),\n'
                  '    \"database\": os.getenv(\"DB_NAME\", \"cvfit_db\"),\n'
                  '    \"port\": 3306\n'
                  '}\n'
              )
              
              # Записуємо фікс і старий контент (але старий config затреться або ми його підмінимо)
              # Для безпеки просто додамо цей блок в кінець або замінимо ініціалізацію mydb
              with open('mySQL_connect.py', 'w', encoding='utf-8') as f:
                  f.write(fix_code + '\n' + content.replace('mydb = mysql.connector.connect(**config)', '# заміна\nmydb = mysql.connector.connect(**config)'))
          "
          
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: cvfit_db
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing
          
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test