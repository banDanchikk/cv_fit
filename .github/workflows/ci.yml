name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          
          # Надійне очищення requirements.txt за допомогою Python-скрипту
          python -c "
          with open('requirements.txt', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          
          # Залишаємо лише ті рядки, де немає згадок про win32, pypiwin32 або pyttsx3
          keywords = ['win32', 'pypiwin32', 'pyttsx3']
          clean_lines = [l for l in lines if not any(kw in l.lower() for kw in keywords)]
          
          with open('requirements.txt', 'w', encoding='utf-8') as f:
              f.writelines(clean_lines)
          "
          
          # Виводимо результат у лог для перевірки
          echo "=== Очищений requirements.txt ==="
          cat requirements.txt
          echo "================================="
          
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test