name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          
          # Універсальне очищення з підтримкою кодувань UTF-16 та UTF-8
          python -c "
          import os
          
          # Визначаємо правильне кодування файлу
          encoding = 'utf-8'
          if os.path.exists('requirements.txt'):
              with open('requirements.txt', 'rb') as f:
                  raw = f.read(2)
                  if raw == b'\xff\xfe' or raw == b'\xfe\xff':
                      encoding = 'utf-16'
          
          print(f'Зчитано файл у кодуванні: {encoding}')
          
          with open('requirements.txt', 'r', encoding=encoding) as f:
              lines = f.readlines()
          
          # Фільтруємо пакети (прибираємо Windows-специфічний софт)
          keywords = ['win32', 'pypiwin32', 'pyttsx3', 'pyaudio']
          clean_lines = [l for l in lines if not any(kw in l.lower() for kw in keywords)]
          
          # Записуємо назад у СТАНДАРТНОМУ UTF-8 без BOM, щоб pip на Linux не панікував
          with open('requirements.txt', 'w', encoding='utf-8') as f:
              f.writelines(clean_lines)
          "
          
          echo "=== Очищений requirements.txt ==="
          cat requirements.txt
          echo "================================="
          
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test