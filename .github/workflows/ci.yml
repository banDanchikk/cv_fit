name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: cvfit_db
          MYSQL_USER: test_user        # Створюємо окремого користувача
          MYSQL_PASSWORD: test_password # Пароль для нього
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          
          # Очищення від Windows-пакетів (БЕЗ редагування mySQL_connect.py)
          python -c "
          import os
          
          encoding = 'utf-8'
          if os.path.exists('requirements.txt'):
              with open('requirements.txt', 'rb') as f:
                  raw = f.read(2)
                  if raw == b'\xff\xfe' or raw == b'\xfe\xff':
                      encoding = 'utf-16'
          
          with open('requirements.txt', 'r', encoding=encoding) as f:
              lines = f.readlines()
          
          keywords = ['win32', 'pypiwin32', 'pyttsx3', 'pyaudio']
          clean_lines = []
          for line in lines:
              if any(kw in line.lower() for kw in keywords):
                  continue
              if 'grpcio-status' in line.lower():
                  clean_lines.append('grpcio-status>=1.62.0,<1.63.0\n')
                  continue
              if 'protobuf' in line.lower():
                  clean_lines.append('protobuf==4.25.3\n')
                  continue
              clean_lines.append(line)
              
          if not any('protobuf' in l.lower() for l in clean_lines):
              clean_lines.append('protobuf==4.25.3\n')
          
          with open('requirements.txt', 'w', encoding='utf-8') as f:
              f.writelines(clean_lines)
              
          # БЕЗПЕЧНИЙ ФІКС БАЗИ ДАНИХ ЧЕРЕЗ CONFTEST
          if os.path.exists('tests/conftest.py'):
              with open('tests/conftest.py', 'r', encoding='utf-8') as f:
                  conftest_content = f.read()
              
              # Цей код виконається ДО імпорту main і примусово підмінить словник в модулі мокінгом
              mock_db_code = (
                  'import sys\n'
                  'import os\n'
                  'import mysql.connector\n'
                  '# Створюємо фейковий модуль або перевизначаємо змінні в системному кеші модулів\n'
                  'class MockMySQLConnect:\n'
                  '    config = {\n'
                  '        \"host\": os.getenv(\"DB_HOST\", \"127.0.0.1\"),\n'
                  '        \"user\": os.getenv(\"DB_USER\", \"test_user\"),\n'
                  '        \"password\": os.getenv(\"DB_PASSWORD\", \"test_password\"),\n'
                  '        \"database\": os.getenv(\"DB_NAME\", \"cvfit_db\"),\n'
                  '        \"port\": 3306\n'
                  '    }\n'
                  'sys.modules[\"mySQL_connect\"] = MockMySQLConnect\n'
                  '# Додатково підміняємо функцію connect, якщо модуль вже десь імпортувався\n'
                  'orig_connect = mysql.connector.connect\n'
                  'def mock_connect(*args, **kwargs):\n'
                  '    kwargs.update({\n'
                  '        \"host\": \"127.0.0.1\",\n'
                  '        \"user\": \"test_user\",\n'
                  '        \"password\": \"test_password\",\n'
                  '        \"database\": \"cvfit_db\",\n'
                  '        \"port\": 3306\n'
                  '    })\n'
                  '    return orig_connect(**kwargs)\n'
                  'mysql.connector.connect = mock_connect\n'
              )
              
              with open('tests/conftest.py', 'w', encoding='utf-8') as f:
                  f.write(mock_db_code + '\n' + conftest_content)
          "
          
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
          
      - name: Run tests with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: cvfit_db
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test