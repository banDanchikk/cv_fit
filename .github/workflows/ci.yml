name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: cvfit_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -c "
          with open('requirements.txt', 'rb') as f:
              raw = f.read()
          encoding = 'utf-16' if raw[:2] in (b'\xff\xfe', b'\xfe\xff') else 'utf-8'
          with open('requirements.txt', 'r', encoding=encoding) as f:
              lines = f.readlines()
          skip = ['win32', 'pypiwin32', 'pyttsx3', 'pyaudio']
          clean = []
          for line in lines:
              if any(k in line.lower() for k in skip):
                  continue
              if 'grpcio-status' in line.lower():
                  clean.append('grpcio-status>=1.62.0,<1.63.0\n')
                  continue
              if 'protobuf' in line.lower():
                  clean.append('protobuf==4.25.3\n')
                  continue
              clean.append(line)
          if not any('protobuf' in l.lower() for l in clean):
              clean.append('protobuf==4.25.3\n')
          with open('requirements.txt', 'w', encoding='utf-8') as f:
              f.writelines(clean)
          "
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Create database schema
        run: |
          mysql -h 127.0.0.1 -u test_user -ptest_password cvfit_db < backend/tests/schema.sql

      - name: Run tests with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: cvfit_db
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test