name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          
          # Видаляємо всі згадки про проблемні Windows-пакети (регістронезалежно)
          sed -i '/[wW][iI][nN]32/d' requirements.txt
          sed -i '/[pP][yY][pP][iI][wW][iI][nN]32/d' requirements.txt
          sed -i '/[pP][yY][tT][tT][sS][xX]3/d' requirements.txt
          
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ --cov=api --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test  # Змінено на 'npm run test', якщо у вас налаштовано скрипт у package.json